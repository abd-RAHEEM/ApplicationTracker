[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobtracker-backend"
version = "0.1.0"
description = "AI-Powered Application Tracker — Backend API"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",          # Form data / file uploads
    "sse-starlette>=2.1.0",             # Server-Sent Events

    # ── Database ───────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",      # ORM with async support
    "alembic>=1.13.0",                  # Database migrations
    "asyncpg>=0.29.0",                  # Async PostgreSQL driver
    "psycopg[binary]>=3.1.19",         # Sync driver for Alembic env.py

    # ── Pydantic / Validation ─────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",           # Pydantic EmailStr support

    # ── Auth & Security ───────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0", # JWT encoding / decoding
    "bcrypt>=4.0.0",                    # bcrypt password hashing (passlib dropped: crashes with bcrypt>=4.0)
    "cryptography>=42.0.0",             # AES-256-GCM for Gmail token encryption

    # ── Background Tasks ──────────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis[asyncio]>=5.0.4",            # Async Redis client + Celery broker

    # ── Email ──────────────────────────────────────────────────────────────────
    "aiosmtplib>=3.0.0",                # Async SMTP for password reset emails

    # ── NLP — Email Parsing (Phase 3) ─────────────────────────────────────────
    "spacy>=3.7.0",                     # en_core_web_sm NER
    "python-dateutil>=2.9.0",           # Flexible date parsing
    "tldextract>=5.1.0",


    # ── Gmail API (Phase 2) ───────────────────────────────────────────────────
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",

    # ── HTTP Client ───────────────────────────────────────────────────────────
    "httpx>=0.27.0",                    # Async HTTP for external API calls

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    "slowapi>=0.1.9",

    # ── Logging ───────────────────────────────────────────────────────────────
    "structlog>=24.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",                    # AsyncClient for route tests
    "factory-boy>=3.3.0",               # Model factories for tests
    "faker>=25.0.0",                    # Fake data generation
    "ruff>=0.4.0",                      # Linter + formatter
    "mypy>=1.10.0",                     # Static type checking
]

# ── Tool Configuration ─────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "S101",  # Allow assert in tests
    "S104",  # Allow binding to 0.0.0.0
    "N818",  # Exception naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
